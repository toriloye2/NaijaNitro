name: Generate detailed NN S1 GLB asset

on:
  pull_request:
    paths:
      - 'tools/build_nn_s1.py'
      - '.github/workflows/generate-camry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model generation dependencies
        run: python -m pip install numpy==2.1.3 trimesh==4.11.1
      - name: Generate procedural game-ready GLB
        run: python tools/build_nn_s1.py
      - name: Verify the asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh
          path = Path('public/vehicles/nn_s1.glb')
          assert path.exists() and path.stat().st_size < 2_000_000
          model = trimesh.load(path, force='scene')
          assert len(model.geometry) >= 30
          print('Validated GLB:', len(model.geometry), 'meshes,', path.stat().st_size, 'bytes')
          PY
      - name: Commit generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vehicles/nn_s1.glb
          if ! git diff --cached --quiet; then
            git commit -m "build: publish generated NN S1 GLB asset"
            git push
          fi
